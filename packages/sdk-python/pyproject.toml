[project]
name = "pal-runtime"
version = "0.1.0"
description = "Python SDK for PAL (Personalized Agentic Layer) — the PAL Runtime"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "grpcio>=1.62",
    "protobuf>=5.0",
    "opentelemetry-api>=1.20",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
deepagents = ["deepagents>=0.6"]

[project.urls]
Homepage = "https://github.com/dshakes/pal"
Source = "https://github.com/dshakes/pal/tree/master/packages/sdk-python"

[project.scripts]
pal-runner = "pal.runtime.runner:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pal*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
