# values-ci.yaml -- kind CI install (.github/workflows/runtime-cluster-e2e.yml, job helm-install).
#
# Brings up the pieces that can boot without prod TLS material or GPUs/KVM:
# control-plane + runtime-scheduler + Postgres/Redis/MinIO, with the default-deny
# NetworkPolicies and the backup CronJob ENABLED so the CNI actually exercises them.
# Everything else renders (helm template/lint covers it) but runs 0 replicas.
# Passwords are generated per run and passed with --set; nothing secret lives here.
#
#   helm install pal infra/helm/pal -f values.yaml -f values-ci.yaml \
#     --set secrets.postgresPassword=$PW --set secrets.minioPassword=$PW ...

global:
  image:
    registry: ""          # images are built in the job and `kind load`ed
    repository: pal
    tag: ci
    pullPolicy: Never
  logLevel: debug

controlPlane:
  replicas: 1
  autoscaling: {enabled: false}
  trustedProxies: "10.0.0.0/8"   # kind pod CIDR
  env:
    PAL_ENV: "development"   # prod guards need TLS Secrets the chart cannot mint

runtimeScheduler:
  replicas: 1
  env:
    PAL_ENV: "development"

gateway:        {replicas: 0, autoscaling: {enabled: false}}
modelRouter:    {replicas: 0, autoscaling: {enabled: false}}
workflowEngine: {replicas: 0, autoscaling: {enabled: false}}
runtimeManager: {replicas: 0}
dashboard:      {replicas: 1, autoscaling: {enabled: false}}   # real image: login page is served through the ingress
surfaceGateway: {replicas: 0}

# ingress-nginx is installed by the job; hosts are resolved with a Host header.
# The dashboard's browser API URL and the control-plane CORS origin are DERIVED
# from these hosts (no explicit publicApiUrl), which is what the job asserts.
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.pal.test
      paths:
        - {path: /v1, pathType: Prefix, service: control-plane}
        - {path: /auth, pathType: Prefix, service: control-plane}
        - {path: /.well-known, pathType: Prefix, service: control-plane}
        - {path: /mcp, pathType: Prefix, service: control-plane}
        - {path: /dl, pathType: Prefix, service: control-plane}
    - host: app.pal.test
      paths:
        - {path: /, pathType: Prefix, service: dashboard}

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

backup:
  enabled: true
  retentionDays: 1

# In-cluster Postgres/S3 are the chart's own templates; keep them small for CI.
postgresql:
  persistence:
    size: 1Gi
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
minio:
  persistence:
    size: 1Gi

secrets:
  jwtSecret: "ci-jwt-secret-not-for-production"
