apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pal.fullname" . }}-dashboard
  labels:
    {{- include "pal.componentLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
spec:
  {{- if not .Values.dashboard.autoscaling.enabled }}
  replicas: {{ .Values.dashboard.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pal.componentSelectorLabels" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pal.componentLabels" (dict "root" . "component" "dashboard") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pal.serviceAccountName" . }}
      containers:
        - name: dashboard
          image: {{ include "pal.image" (dict "root" . "component" .Values.dashboard) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Server-side (middleware, SSR): in-cluster control-plane Service.
            - name: PAL_API_URL
              value: "http://{{ include "pal.fullname" . }}-control-plane:{{ .Values.controlPlane.service.httpPort }}"
            # Browser-side, read by the server at REQUEST time (app/layout.tsx), so one
            # image works anywhere. Unset -> the dashboard falls back to localhost:8080.
            {{- with include "pal.publicApiUrl" . }}
            - name: PAL_PUBLIC_API_URL
              value: {{ . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.dashboard.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
