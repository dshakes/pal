# Build the public site (site/, Astro + Starlight) and deploy it to GitHub Pages
# as one artifact:
#   https://dshakes.github.io/pal/       <- landing, /pal, /runtime, /compare, /about
#   https://dshakes.github.io/pal/docs/  <- Starlight docs
# Plain static HTML, no server. The build fails on any broken docs link.
name: "deploy site (github pages)"

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  # PRs build the site (types, links) without deploying.
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: {}

# Pages deploy needs these; least-privilege otherwise.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install deps
        run: cd site && npm ci
      # Repo is github.com/dshakes/pal -> Pages at /pal (base in
      # site/astro.config.mjs). For a custom domain, change base and site there.
      - name: Build site
        run: cd site && npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
