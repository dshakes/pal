# docker-build-go — PR gate: every Go service image must build (no push) from the repo-root
# context. Catches Go-version drift (go.mod vs builder tag) and broken `replace ../../gen/go`
# contexts, which silently rotted before. Action SHAs pinned like build-images.yml.
name: docker-build-go

on:
  pull_request:
    paths:
      - "services/**"
      - "packages/**"
      - "gen/**"
      - ".github/workflows/docker-build-go.yml"

permissions:
  contents: read

concurrency:
  group: docker-build-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [control-plane, workflow-engine, runtime-scheduler, scheduler, billing, data-plane-agent, memory, notifier]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
