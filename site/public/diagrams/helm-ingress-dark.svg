<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d"><title id="t">The Helm chart in one cluster</title><desc id="d">With ingress enabled, the chart serves two hosts. The app host routes to the dashboard. The API host routes /v1, /auth, /.well-known, /mcp and /dl to the control plane on port 8080. The gateway and every internal service stay off the ingress and talk to each other over mutual TLS; /internal and /metrics are never routed.</desc><rect width="960" height="400" rx="18" fill="#111216"/><rect x="24" y="72" width="168" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="108" y="109.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">browser</text><rect x="24" y="232" width="168" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="108" y="269.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">CLI · SDKs</text><rect x="232" y="56" width="216" height="96" rx="12" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-width="1.5"/><text x="340" y="98.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">app host</text><text x="340" y="114.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">app.example.com</text><rect x="232" y="216" width="216" height="96" rx="12" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-width="1.5"/><text x="340" y="258.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">API host</text><text x="340" y="274.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">/v1 /auth /mcp …</text><path d="M192 104 L232 104" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M223.9 107.9 L232 104 L223.9 100.1" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M192 264 L232 264" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M223.9 267.9 L232 264 L223.9 260.1" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M108 136 L108 184 L300 184 L300 216" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M296.1 207.9 L300 216 L303.9 207.9" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="176" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="start">pages call the API</text><rect x="488" y="24" width="448" height="352" rx="18" fill="#111216" stroke="#7c8cff" stroke-width="1.5" stroke-dasharray="6 5"/><text x="508" y="52" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="start">your cluster</text><rect x="512" y="72" width="196" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="610" y="98.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">dashboard</text><text x="610" y="114.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">:3000</text><rect x="512" y="232" width="196" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="2"/><text x="610" y="258.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">control plane</text><text x="610" y="274.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">:8080</text><path d="M448 104 L512 104" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M503.9 107.9 L512 104 L503.9 100.1" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 264 L512 264" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M503.9 267.9 L512 264 L503.9 260.1" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="736" y="72" width="176" height="224" rx="12" fill="#7c8cff" fill-opacity="0.12" stroke="#7c8cff" stroke-width="1.5"/><text x="824" y="167.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">internal only</text><text x="824" y="183.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">gateway · engine</text><text x="824" y="199.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">router · runtime</text><path d="M708 264 L736 264" fill="none" stroke="#7c8cff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M727.9 267.9 L736 264 L727.9 260.1" fill="none" stroke="#7c8cff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="822" y="324" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">mutual TLS</text><circle cx="524" cy="344" r="10" fill="#ef4444"/><path d="M519.5 339.5 l9 9 M528.5 339.5 l-9 9" stroke="#111216" stroke-width="2.4" stroke-linecap="round"/><text x="542" y="349" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#ff8a8a" text-anchor="start">/internal · /metrics never routed</text></svg>
