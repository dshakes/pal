<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 576" width="420" height="576" role="img" aria-labelledby="t d"><title id="t">The Helm chart in one cluster</title><desc id="d">With ingress enabled, the chart serves two hosts. The app host routes to the dashboard. The API host routes /v1, /auth, /.well-known, /mcp and /dl to the control plane on port 8080. The gateway and every internal service stay off the ingress and talk to each other over mutual TLS; /internal and /metrics are never routed.</desc><rect width="420" height="576" rx="18" fill="#111216"/><rect x="24" y="24" width="178" height="56" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="113" y="57.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">browser</text><rect x="218" y="24" width="178" height="56" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="307" y="57.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">CLI · SDKs</text><path d="M113 80 L113 112" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M109.1 103.9 L113 112 L116.9 103.9" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M307 80 L307 112" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M303.1 103.9 L307 112 L310.9 103.9" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="112" width="178" height="80" rx="12" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-width="1.5"/><text x="113" y="146.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">app host</text><text x="113" y="162.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">dashboard</text><rect x="218" y="112" width="178" height="80" rx="12" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-width="1.5"/><text x="307" y="146.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">API host</text><text x="307" y="162.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">/v1 /auth …</text><path d="M113 192 L113 252" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M109.1 243.9 L113 252 L116.9 243.9" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M307 192 L307 252" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M303.1 243.9 L307 252 L310.9 243.9" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="228" width="372" height="324" rx="18" fill="#111216" stroke="#7c8cff" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="36" y="252" width="166" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="119" y="278.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">dashboard</text><text x="119" y="294.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">:3000</text><rect x="218" y="252" width="166" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="2"/><text x="301" y="278.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">control plane</text><text x="301" y="294.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">:8080</text><path d="M307 316 L307 348" fill="none" stroke="#7c8cff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M303.1 339.9 L307 348 L310.9 339.9" fill="none" stroke="#7c8cff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="348" width="348" height="96" rx="12" fill="#7c8cff" fill-opacity="0.12" stroke="#7c8cff" stroke-width="1.5"/><text x="210" y="379.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#fafaf8" text-anchor="middle">internal only · mutual TLS</text><text x="210" y="395.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">gateway · engine</text><text x="210" y="411.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b9bac0" text-anchor="middle">router · runtime</text><circle cx="52" cy="488" r="10" fill="#ef4444"/><path d="M47.5 483.5 l9 9 M56.5 483.5 l-9 9" stroke="#111216" stroke-width="2.4" stroke-linecap="round"/><text x="70" y="493" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#ff8a8a" text-anchor="start">/internal, /metrics</text><text x="70" y="517" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#ff8a8a" text-anchor="start">never routed</text></svg>
